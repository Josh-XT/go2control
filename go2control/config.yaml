# Go2 Control — Configuration
# AGiXT Voice Client for Unitree Go2 Pro

agixt:
  # WebSocket server URL (ws:// or wss://)
  server: "ws://localhost:7437"
  # JWT token for authentication
  jwt: ""
  # Conversation ID ("-" creates a new one)
  conversation_id: "-"
  # Agent name
  agent: "XT"

robot:
  # Connection type: "dds" (Ethernet) or "webrtc" (WiFi)
  connection: "dds"
  # Robot IP (192.168.123.161 for DDS, 192.168.12.1 for AP mode)
  ip: "192.168.123.161"
  # Network interface for DDS
  interface: "eth0"

camera:
  enabled: true
  # Seconds between camera frames sent to AGiXT for vision context
  interval: 3.0
  # JPEG compression quality (0-100)
  quality: 70

audio:
  enabled: true
  sample_rate: 48000
  channels: 1
  # Seconds of audio per chunk for VAD
  chunk_duration: 0.5
  # RMS silence threshold
  silence_threshold: 500
  # Seconds of silence before end-of-speech
  silence_duration: 1.5
  # Max seconds of continuous speech
  max_speech_duration: 30.0

identity_evidence:
  # Sends server-authoritative signed face/voice evidence over the AGiXT voice WebSocket.
  # WorkConductor still performs all biometric matching and identity decisions.
  enabled: true
  company_id: ""
  machine_id: ""
  key_id: ""
  signing_secret: ""
  algorithm: "hmac_sha256"
  camera_stream_id: "go2-camera"
  audio_stream_id: "go2-audio"
  camera_enabled: true
  audio_enabled: true
  max_face_evidence_bytes: 262144
  max_voice_evidence_bytes: 524288

safety:
  # Maximum velocities (conservative for voice control)
  max_vx: 1.0      # m/s forward/backward
  max_vy: 0.5      # m/s lateral
  max_vyaw: 1.5    # rad/s rotation
  # Default duration for move commands
  default_move_duration: 2.0

# Set to true to test without a real robot
simulation: false
